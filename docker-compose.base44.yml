services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        npx --yes browser-sync@3.0.4 start
        --server /app
        --files '/app/**/*'
        --host 0.0.0.0
        --port 3000
        --no-open
        --no-ui
        --no-ghost-mode
    volumes:
      - .:/app
      - browser_sync_cache:/root/.npm
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  browser_sync_cache:
