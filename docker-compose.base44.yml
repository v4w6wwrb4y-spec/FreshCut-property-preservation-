services:
  api:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        npm install &&
        node server/seed.js &&
        npx nodemon --watch server server/index.js
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - JWT_SECRET=freshcut-dev-secret-2024
      - PORT=8001
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/api/auth/me').then(r=>{if(r.status<500)process.exit(0);process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    image: node:22
    working_dir: /app/client
    command:
      - sh
      - -c
      - >-
        npm install &&
        npm run dev
    volumes:
      - .:/app
      - web_node_modules:/app/client/node_modules
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://api:8001
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(r.ok)process.exit(0);process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

volumes:
  api_node_modules:
  web_node_modules:
